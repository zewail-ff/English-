
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>لعبة حفظ الكلمات - منهج الثانوية</title>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --bg: #0f0a1e;
    --bg-grad: radial-gradient(ellipse 120% 80% at 20% -10%, #3b1d6e 0%, transparent 50%),
               radial-gradient(ellipse 100% 60% at 90% 10%, #1e3a5f 0%, transparent 45%),
               radial-gradient(ellipse 80% 50% at 50% 100%, #1a0a2e 0%, transparent 50%),
               #0f0a1e;
    --surface: rgba(255, 255, 255, 0.07);
    --surface-solid: #1a1430;
    --surface-2: rgba(255, 255, 255, 0.1);
    --primary: #a78bfa;
    --primary-bright: #c4b5fd;
    --primary-deep: #7c3aed;
    --primary-soft: rgba(167, 139, 250, 0.18);
    --glow: 0 0 40px rgba(167, 139, 250, 0.35);
    --text: #f5f3ff;
    --text-light: #a5b4c8;
    --border: rgba(255, 255, 255, 0.12);
    --shadow: 0 20px 50px -15px rgba(0, 0, 0, 0.6);
    --radius: 24px;
    --radius-sm: 16px;
    --radius-pill: 999px;
    --transition: 0.3s cubic-bezier(0.34, 1.2, 0.64, 1);
    --success: #34d399;
    --success-soft: rgba(52, 211, 153, 0.18);
    --danger: #fb7185;
    --danger-soft: rgba(251, 113, 133, 0.18);
    --gold: #fbbf24;
    --gold-soft: rgba(251, 191, 36, 0.2);
    --font: 'Cairo', system-ui, sans-serif;
    --font-display: 'Space Grotesk', 'Cairo', system-ui, sans-serif;
}

/* Light theme – أنظف وأهدأ */
html:not([data-theme="dark"]) {
    --bg: #f0f4f8;
    --bg-grad: linear-gradient(165deg, #eef2ff 0%, #f8fafc 40%, #f0f9ff 100%);
    --surface: #ffffff;
    --surface-solid: #ffffff;
    --surface-2: #f8fafc;
    --primary: #4f46e5;
    --primary-bright: #6366f1;
    --primary-deep: #4338ca;
    --primary-soft: rgba(79, 70, 229, 0.1);
    --glow: 0 6px 24px rgba(79, 70, 229, 0.18);
    --text: #0f172a;
    --text-light: #64748b;
    --border: rgba(148, 163, 184, 0.35);
    --shadow: 0 10px 30px -8px rgba(15, 23, 42, 0.1);
    --success: #059669;
    --success-soft: rgba(5, 150, 105, 0.1);
    --danger: #e11d48;
    --danger-soft: rgba(225, 29, 72, 0.1);
    --gold: #d97706;
    --gold-soft: rgba(217, 119, 6, 0.12);
}

body {
    font-family: var(--font);
    background: var(--bg);
    background-image: var(--bg-grad);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    padding: 20px 14px 50px;
    transition: background 0.4s ease, color 0.3s ease;
    -webkit-font-smoothing: antialiased;
    line-height: 1.6;
}

.app-container {
    max-width: 640px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
}

/* ===== CARD ===== */
.card {
    background: var(--surface);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px 20px;
    margin-bottom: 16px;
    transition: all var(--transition);
    border: 1px solid var(--border);
}
html:not([data-theme="dark"]) .card {
    background: #ffffff;
    box-shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
    border-color: rgba(148, 163, 184, 0.25);
}
html:not([data-theme="dark"]) body {
    background: #f0f4f8;
    background-image: linear-gradient(165deg, #eef2ff 0%, #f8fafc 45%, #f0f9ff 100%);
}
html:not([data-theme="dark"]) .btn-outline {
    background: #fff;
    border-width: 1.5px;
}
html:not([data-theme="dark"]) .quiz-option {
    background: #fff;
}
html:not([data-theme="dark"]) .quiz-input {
    background: #fff;
}

/* ===== TYPOGRAPHY ===== */
h1 {
    font-family: var(--font-display);
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    background: linear-gradient(120deg, var(--primary-deep), var(--primary-bright), #ec4899);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
}
h2 {
    font-family: var(--font-display);
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 14px;
    letter-spacing: -0.3px;
}
h3 {
    font-size: 1.08rem;
    font-weight: 700;
    margin-bottom: 8px;
}
.text-muted {
    color: var(--text-light);
    font-size: 0.92rem;
}
.text-center { text-align: center; }
.flex { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
.gap-8 { gap: 8px; }
.gap-12 { gap: 12px; }
.mt-8 { margin-top: 8px; }
.mt-12 { margin-top: 12px; }
.mb-8 { margin-bottom: 8px; }
.mb-12 { margin-bottom: 12px; }
.w-full { width: 100%; }

/* ===== BUTTONS ===== */
.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 24px;
    border: none;
    border-radius: var(--radius-pill);
    font-family: var(--font);
    font-weight: 700;
    font-size: 1rem;
    background: linear-gradient(135deg, var(--primary-deep) 0%, var(--primary-bright) 100%);
    color: #fff;
    cursor: pointer;
    transition: all var(--transition);
    box-shadow: var(--glow);
    flex: 0 1 auto;
    min-width: 48px;
    min-height: 52px;
    touch-action: manipulation;
    user-select: none;
    border: 1px solid transparent;
    letter-spacing: 0.02em;
}
.btn:hover {
    transform: translateY(-4px) scale(1.02);
    box-shadow: 0 12px 36px rgba(124, 58, 237, 0.45);
    filter: brightness(1.1);
}
.btn:active { transform: scale(0.96); }
.btn-outline {
    background: transparent;
    color: var(--primary);
    border: 2px solid var(--border);
    box-shadow: none;
}
.btn-outline:hover {
    background: var(--primary-soft);
    border-color: var(--primary);
    color: var(--primary-deep);
    box-shadow: none;
    filter: none;
}
[data-theme="dark"] .btn-outline { color: var(--primary-bright); }
[data-theme="dark"] .btn-outline:hover { color: #fff; border-color: var(--primary); }
.btn-success {
    background: linear-gradient(135deg, #059669, #34d399);
    box-shadow: 0 8px 28px rgba(52, 211, 153, 0.35);
}
.btn-success:hover { box-shadow: 0 12px 32px rgba(52, 211, 153, 0.5); }
.btn-danger {
    background: linear-gradient(135deg, #e11d48, #fb7185);
    box-shadow: 0 8px 28px rgba(251, 113, 133, 0.35);
}
.btn-danger:hover { box-shadow: 0 12px 32px rgba(251, 113, 133, 0.5); }
.btn-gold {
    background: linear-gradient(135deg, #d97706, #fbbf24);
    color: #1c1917;
    box-shadow: 0 8px 28px rgba(251, 191, 36, 0.4);
}
.btn-gold:hover { box-shadow: 0 12px 32px rgba(251, 191, 36, 0.55); }
.btn-sm { padding: 10px 18px; font-size: 0.9rem; min-height: 42px; }
.btn-block { width: 100%; justify-content: center; }
.btn-icon { width: 50px; height: 50px; padding: 0; border-radius: 50%; font-size: 1.35rem; }

/* ===== GRID ===== */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

/* ===== PROGRESS ===== */
.progress-bar {
    width: 100%;
    height: 10px;
    background: var(--border);
    border-radius: var(--radius-pill);
    overflow: hidden;
    margin: 12px 0;
}
.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary-deep), var(--primary-bright), #ec4899);
    border-radius: var(--radius-pill);
    transition: width 0.6s cubic-bezier(0.34, 1.2, 0.64, 1);
    width: 0%;
    box-shadow: 0 0 16px rgba(167, 139, 250, 0.6);
}

/* ===== BADGE ===== */
.badge {
    display: inline-flex;
    align-items: center;
    padding: 6px 14px;
    border-radius: var(--radius-pill);
    font-size: 0.8rem;
    font-weight: 700;
    background: var(--primary-soft);
    color: var(--primary-deep);
}
[data-theme="dark"] .badge { color: var(--primary-bright); }
.badge-primary {
    background: linear-gradient(135deg, var(--primary-deep), var(--primary-bright));
    color: #fff;
}
.badge-success { background: var(--success); color: #fff; }
.badge-danger { background: var(--danger); color: #fff; }

/* ===== QUIZ ===== */
.quiz-option {
    display: block;
    width: 100%;
    padding: 16px 20px;
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface-2);
    color: var(--text);
    font-size: 1.05rem;
    font-family: var(--font);
    text-align: right;
    transition: all 0.22s ease;
    cursor: pointer;
    margin-bottom: 10px;
    font-weight: 600;
}
.quiz-option:hover {
    border-color: var(--primary);
    background: var(--primary-soft);
    transform: translateX(-4px);
}
.quiz-option:active { transform: scale(0.98); }
.quiz-option.correct {
    border-color: var(--success);
    background: var(--success-soft);
    color: var(--success);
    box-shadow: 0 0 0 4px var(--success-soft);
}
.quiz-option.wrong {
    border-color: var(--danger);
    background: var(--danger-soft);
    color: var(--danger);
    box-shadow: 0 0 0 4px var(--danger-soft);
}
.quiz-option.disabled { pointer-events: none; opacity: 0.7; }
.quiz-input {
    width: 100%;
    padding: 18px 20px;
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 1.2rem;
    font-family: var(--font);
    background: var(--surface-2);
    color: var(--text);
    text-align: center;
    font-weight: 700;
    letter-spacing: 0.8px;
    transition: all var(--transition);
}
.quiz-input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 5px var(--primary-soft);
}
.letter-tile {
    display: inline-flex;
    width: 52px;
    height: 52px;
    margin: 5px;
    border-radius: 14px;
    background: linear-gradient(145deg, var(--primary-deep), var(--primary-bright));
    color: #fff;
    font-size: 1.4rem;
    font-weight: 800;
    font-family: var(--font-display);
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
    user-select: none;
    touch-action: manipulation;
    border: none;
    box-shadow: 0 6px 16px rgba(124, 58, 237, 0.35);
}
.letter-tile:hover { transform: translateY(-3px); }
.letter-tile:active { transform: scale(0.88); }
.letter-tile.empty {
    background: var(--border);
    color: transparent;
    pointer-events: none;
    box-shadow: none;
}
.letter-tile.selected {
    background: linear-gradient(145deg, #d97706, #fbbf24);
    transform: scale(0.93);
    box-shadow: 0 6px 18px rgba(251, 191, 36, 0.4);
}
.letter-tile.used {
    opacity: 0.25;
    pointer-events: none;
    transform: scale(0.85);
}
.letter-slot {
    display: inline-flex;
    width: 28px;
    height: 36px;
    flex-shrink: 0;
    border-radius: 8px;
    border: 2px dashed var(--border);
    background: var(--surface-2);
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    font-weight: 800;
    font-family: var(--font-display);
    color: var(--text);
    transition: all 0.2s ease;
}
#orderSlots {
    direction: ltr !important;
    flex-wrap: nowrap !important;
    overflow-x: auto;
    justify-content: center;
    gap: 4px !important;
    -webkit-overflow-scrolling: touch;
}
#orderContainer {
    direction: ltr !important;
}
.letter-tile {
    width: 36px !important;
    height: 36px !important;
    font-size: 1.05rem !important;
    margin: 3px !important;
}
.letter-slot.filled {
    border-style: solid;
    border-color: var(--primary);
    background: var(--primary-soft);
    box-shadow: 0 4px 12px rgba(124, 58, 237, 0.2);
}
.letter-slot.correct-slot {
    border-color: var(--success);
    background: var(--success-soft);
}
.letter-slot.wrong-slot {
    border-color: var(--danger);
    background: var(--danger-soft);
    animation: shake 0.4s ease;
}
@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
}

/* ===== STATS ===== */
.stat-row {
    display: flex;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.98rem;
    font-weight: 600;
}
.stat-row:last-child { border-bottom: none; }

/* ===== ACHIEVEMENT ===== */
.achievement-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 12px;
}
.achievement-item {
    background: var(--surface-2);
    border-radius: var(--radius-sm);
    padding: 16px 10px;
    text-align: center;
    font-size: 0.82rem;
    opacity: 0.4;
    transition: all var(--transition);
    border: 2px solid transparent;
    font-weight: 600;
}
.achievement-item.unlocked {
    opacity: 1;
    background: var(--surface-solid);
    border-color: var(--gold);
    box-shadow: 0 0 0 4px var(--gold-soft), var(--shadow);
}
.achievement-item .emoji {
    font-size: 2.2rem;
    display: block;
    margin-bottom: 6px;
}

/* ===== DARK TOGGLE ===== */
.theme-toggle {
    position: fixed;
    top: 18px;
    left: 18px;
    z-index: 100;
    background: var(--surface);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    border-radius: 50%;
    width: 52px;
    height: 52px;
    font-size: 1.4rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: all var(--transition);
    color: var(--text);
}
.theme-toggle:hover {
    transform: scale(1.1) rotate(15deg);
}

/* ===== SCROLL ===== */
.scroll-horiz {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 0 12px;
    flex-wrap: nowrap;
    -webkit-overflow-scrolling: touch;
}
.scroll-horiz .btn { flex: 0 0 auto; }

/* ===== MISC ===== */
.hidden { display: none !important; }
.fade-in { animation: fadeUp 0.4s cubic-bezier(0.34, 1.2, 0.64, 1); }
@keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
}
.tag {
    display: inline-block;
    background: var(--primary-soft);
    padding: 5px 14px;
    border-radius: var(--radius-pill);
    font-size: 0.8rem;
    color: var(--primary-deep);
    font-weight: 600;
}
[data-theme="dark"] .tag { color: var(--primary-bright); }
.responsive-img { max-width: 100%; height: auto; }

input[type="checkbox"].multi-check {
    width: 20px;
    height: 20px;
    accent-color: var(--primary);
    cursor: pointer;
}

header.card { padding-top: 20px; padding-bottom: 18px; }

/* ===== RESPONSIVE ===== */
@media (max-width: 480px) {
    body { padding: 14px 10px 42px; }
    .grid-2 { grid-template-columns: 1fr; }
    .grid-3 { grid-template-columns: 1fr 1fr; }
    h1 { font-size: 1.65rem; }
    .card { padding: 18px 15px; border-radius: 20px; }
    .btn { padding: 13px 16px; font-size: 0.95rem; min-height: 48px; }
    .theme-toggle { top: 12px; left: 12px; width: 46px; height: 46px; font-size: 1.25rem; }
    .letter-tile { width: 48px; height: 48px; font-size: 1.3rem; }
}
</style>
</head>

<button class="theme-toggle" id="themeToggle" aria-label="تبديل الوضع الليلي">🌙</button>

    <!-- ===== DYNAMIC SCREENS ===== -->
    <div id="screenContainer"></div>
</div>

        totalQuestions: 0,
        wrongWords: {},
        hardWords: {},
        consecutiveCorrect: {},
        achievements: [],
        stats: {}
    };

    function loadState() {
        try {
            const saved = localStorage.getItem('wordmaster_state');
            if (saved) {
                const parsed = JSON.parse(saved);
                for (let key in parsed) {
                    if (state.hasOwnProperty(key)) {
                        if (typeof state[key] === 'object' && state[key] !== null && !Array.isArray(state[key])) {
                            state[key] = { ...state[key], ...parsed[key] };
                        } else {
                            state[key] = parsed[key];
                        }
                    }
                }
            }
        } catch (e) { /* تجاهل */ }
    }

    function saveState() {
        localStorage.setItem('wordmaster_state', JSON.stringify(state));
        updateUI();
    }

    function countAllWords() {
        let total = 0;
        for (let unit in data) {
            for (let lesson in data[unit]) {
                total += data[unit][lesson].length;
            }
        }
        return total;
    }

    function getWordsFromSelection(unitsLessons) {
        let words = [];
        for (let unit in unitsLessons) {
            if (data[unit]) {

                for (let lesson of lessons) {
                    if (data[unit][lesson]) {
                        words = words.concat(data[unit][lesson]);
                    }
                }
            }
        }
        return words;
    }

    // ============================================================
    //  6. QUIZ ENGINE
    // ============================================================
    let currentQuiz = {
        words: [],
        currentIndex: 0,
        total: 0,
        correctCount: 0,
        wrongCount: 0,
        type: 'write',
        answered: false
    };

    function startQuiz(words, type = null) {
        if (!words || words.length === 0) {
            alert('لا توجد كلمات للامتحان!');
            return;
        }
        words = shuffleArray([...words]);
        const types = ['write', 'choice', 'order'];
        currentQuiz = {
            words: words,
            currentIndex: 0,
            total: words.length,
            correctCount: 0,
            wrongCount: 0,
            type: type || types[Math.floor(Math.random() * types.length)],
            answered: false
        };
        menuSection.style.display = 'none';
        renderQuizQuestion();
    }

    function renderQuizQuestion() {
        if (currentQuiz.currentIndex >= currentQuiz.total) {
            finishQuiz();
            return;
        }
        const word = currentQuiz.words[currentQuiz.currentIndex];
        const qType = currentQuiz.type;
        let actualType = qType;
        if (qType === 'random') {
            const types = ['write', 'choice', 'order'];
            actualType = types[Math.floor(Math.random() * types.length)];
        }
        let questionHTML = '';
        let inputHTML = '';
        let displayAr = word.ar;

        switch(actualType) {
            case 'write':
                questionHTML = `<p style="font-size:1.8rem;font-weight:600;text-align:center;">${displayAr}</p>
                    <p class="text-muted text-center">اكتب الكلمة بالإنجليزية كاملة</p>`;
                inputHTML = `<input class="quiz-input" id="quizInput" type="text" placeholder="اكتب هنا..." autofocus>
                    <button class="btn btn-success btn-block mt-8" id="submitWrite">تأكيد</button>`;
                break;
            case 'choice':
                const choices = generateChoices(word, currentQuiz.words);
                questionHTML = `<p style="font-size:1.8rem;font-weight:600;text-align:center;">${displayAr}</p>
                    <p class="text-muted text-center">اختر الإجابة الصحيحة</p>`;
                inputHTML = `<div id="choiceContainer">`;
                choices.forEach((ch, idx) => {
                    const isCorrect = ch === word.en;
                    inputHTML += `<button class="quiz-option" data-choice="${ch}" data-correct="${isCorrect}">${ch}</button>`;
                });
                inputHTML += `</div>`;
                break;
            case 'order': {
                // تجاهل المسافات والشرطات في الترتيب، نعرض فراغات للكلمة
                const cleanWord = word.en.replace(/\s+/g, '');
                const chars = cleanWord.split('');
                const letters = shuffleArray([...chars]);
                // خانات فارغة بعدد الحروف
                let slotsHTML = '';
                for (let i = 0; i < chars.length; i++) {
                    slotsHTML += `<div class="letter-slot" data-slot="${i}"></div>`;
                }
                questionHTML = `<p style="font-size:1.8rem;font-weight:600;text-align:center;">${displayAr}</p>
                    <p class="text-muted text-center">اضغط الحروف بالترتيب الصحيح</p>`;
                inputHTML = `
                    <div id="orderSlots" style="display:flex;flex-wrap:nowrap;justify-content:center;gap:4px;margin:14px 0;min-height:40px;direction:ltr;overflow-x:auto;">${slotsHTML}</div>
                    <div id="orderContainer" style="display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin:12px 0;direction:ltr;">`;
                letters.forEach((l, idx) => {
                    inputHTML += `<button class="letter-tile" data-idx="${idx}" data-letter="${l}">${l}</button>`;
                });
                inputHTML += `</div>
                    <div class="flex gap-8" style="justify-content:center;margin-top:8px;">
                        <button class="btn btn-outline btn-sm" id="shuffleOrder">🔀 خلط</button>
                        <button class="btn btn-outline btn-sm" id="clearOrder">🗑️ مسح</button>
                        <button class="btn btn-success btn-sm" id="submitOrder">✓ تأكيد</button>
                    </div>`;
                break;
            }
        }

        const progress = ((currentQuiz.currentIndex) / currentQuiz.total * 100);
        const html = `
            <div class="card">
                <div class="flex-between">
                    <span class="badge">${currentQuiz.currentIndex+1} / ${currentQuiz.total}</span>
                    <span class="badge badge-primary">${actualType}</span>
                </div>
                <div class="progress-bar"><div class="progress-fill" style="width:${progress}%;"></div></div>
                ${questionHTML}
                ${inputHTML}
                <div id="feedbackArea" style="margin-top:12px;text-align:center;font-size:1.2rem;min-height:40px;"></div>
                <button class="btn btn-outline btn-block mt-8" data-action="quitQuiz">🚪 إنهاء الامتحان</button>
            </div>
        `;
        container.innerHTML = html;
        menuSection.style.display = 'none';
        bindQuizEvents(actualType, word);
        bindEvents(); // لربط زر إنهاء الامتحان وغيره
    }

    function generateChoices(correctWord, allWords) {
        let choices = [correctWord.en];
        const similar = allWords.filter(w => w.en !== correctWord.en && w.en.length === correctWord.en.length);
        shuffleArray(similar);
        for (let w of similar) {
            if (choices.length < 4) {
                choices.push(w.en);
            }
        }
        while (choices.length < 4) {
            const rand = allWords[Math.floor(Math.random() * allWords.length)];
            if (rand && !choices.includes(rand.en)) {
                choices.push(rand.en);
            } else {
                choices.push('????');
            }
        }
        shuffleArray(choices);
        return choices;
    }

    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // ============================================================
    //  7. QUIZ EVENTS
    // ============================================================
    function bindQuizEvents(type, word) {
        const feedback = document.getElementById('feedbackArea');
        if (type === 'write') {
            const input = document.getElementById('quizInput');
            const submitBtn = document.getElementById('submitWrite');
            if (input) {
                input.focus();
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') submitBtn.click();
                });
            }
            if (submitBtn) {
                submitBtn.addEventListener('click', function() {
                    if (currentQuiz.answered) return;
                    const val = document.getElementById('quizInput').value.trim();
                    if (!val) { feedback.innerHTML = '⚠️ الرجاء إدخال كلمة'; return; }
                    checkWriteAnswer(val, word, feedback);
                });
            }
        } else if (type === 'choice') {
            document.querySelectorAll('.quiz-option').forEach(btn => {
                btn.addEventListener('click', function() {
                    if (currentQuiz.answered) return;
                    const isCorrect = this.dataset.correct === 'true';
                    const choice = this.dataset.choice;
                    checkChoiceAnswer(isCorrect, word, this, feedback);
                });
            });
        } else if (type === 'order') {
            const cleanTarget = word.en.replace(/\s+/g, '').toLowerCase();
            const container = document.getElementById('orderContainer');
            const slotsDiv = document.getElementById('orderSlots');
            const submitBtn = document.getElementById('submitOrder');
            const clearBtn = document.getElementById('clearOrder');
            const shuffleBtn = document.getElementById('shuffleOrder');
            let built = []; // {letter, tileEl}

            function renderSlots() {
                const slots = slotsDiv.querySelectorAll('.letter-slot');
                slots.forEach((slot, i) => {
                    if (built[i]) {
                        slot.textContent = built[i].letter;
                        slot.classList.add('filled');
                    } else {
                        slot.textContent = '';
                        slot.classList.remove('filled', 'correct-slot', 'wrong-slot');
                    }
                });
            }

            function tryAutoCheck() {
                if (built.length === cleanTarget.length) {
                    const userWord = built.map(b => b.letter).join('');
                    // تأخير بسيط عشان يشوف الحروف ممتلئة
                    setTimeout(() => {
                        if (!currentQuiz.answered) checkOrderAnswer(userWord, word, feedback, slotsDiv);
                    }, 280);
                }
            }

            if (container) {
                container.querySelectorAll('.letter-tile').forEach(tile => {
                    tile.addEventListener('click', function() {
                        if (currentQuiz.answered || this.classList.contains('used')) return;
                        if (built.length >= cleanTarget.length) return;
                        const letter = this.dataset.letter;
                        built.push({ letter, tileEl: this });
                        this.classList.add('used');
                        renderSlots();
                        tryAutoCheck();
                    });
                });
            }

            // الضغط على خانة مملوءة يرجّع الحرف
            if (slotsDiv) {
                slotsDiv.addEventListener('click', function(e) {
                    if (currentQuiz.answered) return;
                    const slot = e.target.closest('.letter-slot');
                    if (!slot || !slot.classList.contains('filled')) return;
                    const idx = parseInt(slot.dataset.slot);
                    if (idx !== built.length - 1) {
                        // امسح من هذا الموضع للنهاية
                        const removed = built.splice(idx);
                        removed.forEach(r => r.tileEl.classList.remove('used'));
                    } else {
                        const last = built.pop();
                        if (last) last.tileEl.classList.remove('used');
                    }
                    renderSlots();
                });
            }

            if (clearBtn) {
                clearBtn.addEventListener('click', function() {
                    if (currentQuiz.answered) return;
                    built.forEach(b => b.tileEl.classList.remove('used'));
                    built = [];
                    renderSlots();
                    feedback.innerHTML = '';
                });
            }

            if (shuffleBtn) {
                shuffleBtn.addEventListener('click', function() {
                    if (currentQuiz.answered) return;
                    built.forEach(b => b.tileEl.classList.remove('used'));
                    built = [];
                    renderSlots();
                    feedback.innerHTML = '';
                    const tiles = Array.from(container.querySelectorAll('.letter-tile'));
                    const parent = container;
                    shuffleArray(tiles);
                    tiles.forEach(t => parent.appendChild(t));
                });
            }

            if (submitBtn) {
                submitBtn.addEventListener('click', function() {
                    if (currentQuiz.answered) return;
                    if (built.length !== cleanTarget.length) {
                        feedback.innerHTML = '⚠️ كمّل كل الحروف أولاً';
                        feedback.style.color = 'var(--gold)';
                        return;
                    }
                    const userWord = built.map(b => b.letter).join('');
                    checkOrderAnswer(userWord, word, feedback, slotsDiv);
                });
            }
        }
    }

    // ============================================================
    //  8. CHECK ANSWERS
    // ============================================================
    function checkWriteAnswer(userAnswer, word, feedback) {
        const normalized = userAnswer.toLowerCase().trim();
        const correct = word.en.toLowerCase().trim();
        const isCorrect = normalized === correct;
        handleAnswer(isCorrect, word, feedback);
    }

    function checkChoiceAnswer(isCorrect, word, btn, feedback) {
        document.querySelectorAll('.quiz-option').forEach(b => b.classList.add('disabled'));
        if (isCorrect) {
            btn.classList.add('correct');
        } else {
            btn.classList.add('wrong');
            document.querySelectorAll('.quiz-option').forEach(b => {
                if (b.dataset.correct === 'true') b.classList.add('correct');
            });
        }
        handleAnswer(isCorrect, word, feedback);
    }

    function checkOrderAnswer(userWord, word, feedback, slotsDiv) {
        const cleanTarget = word.en.replace(/\s+/g, '').toLowerCase();
        const isCorrect = userWord.toLowerCase().trim() === cleanTarget;
        if (slotsDiv) {
            const slots = slotsDiv.querySelectorAll('.letter-slot');
            slots.forEach((slot, i) => {
                slot.classList.remove('correct-slot', 'wrong-slot');
                if (isCorrect) {
                    slot.classList.add('correct-slot');
                } else {
                    const targetChar = cleanTarget[i];
                    const userChar = (userWord[i] || '').toLowerCase();
                    slot.classList.add(userChar === targetChar ? 'correct-slot' : 'wrong-slot');
                }
            });
        }
        handleAnswer(isCorrect, word, feedback);
    }

    function handleAnswer(isCorrect, word, feedback) {
        if (currentQuiz.answered) return;
        currentQuiz.answered = true;
        const wordEn = word.en;

        if (isCorrect) {
            state.score += 10;
            state.combo += 1;
            state.totalCorrect += 1;
            currentQuiz.correctCount = (currentQuiz.correctCount || 0) + 1;
            if (state.combo > state.maxCombo) state.maxCombo = state.combo;
            if (state.totalCorrect % 10 === 0) state.level += 1;
            if (state.wrongWords[wordEn]) {
                state.wrongWords[wordEn] -= 1;
                if (state.wrongWords[wordEn] <= 0) delete state.wrongWords[wordEn];
            }
            if (state.hardWords[wordEn]) {
                if (!state.consecutiveCorrect[wordEn]) state.consecutiveCorrect[wordEn] = 0;
                state.consecutiveCorrect[wordEn] += 1;
                if (state.consecutiveCorrect[wordEn] >= 5) {
                    delete state.hardWords[wordEn];
                    delete state.consecutiveCorrect[wordEn];
                }
            }
            feedback.innerHTML = '✅ صحيح!';
            feedback.style.color = 'var(--success)';
        } else {
            state.score = Math.max(0, state.score - 5);
            state.combo = 0;
            state.totalWrong += 1;
            currentQuiz.wrongCount = (currentQuiz.wrongCount || 0) + 1;
            if (!state.wrongWords[wordEn]) state.wrongWords[wordEn] = 0;
            state.wrongWords[wordEn] += 1;
            if (!state.hardWords[wordEn]) state.hardWords[wordEn] = 0;
            state.hardWords[wordEn] += 1;
            if (state.hardWords[wordEn] >= 3) {
                state.hardWords[wordEn] = 3;
                delete state.consecutiveCorrect[wordEn];
            }
            feedback.innerHTML = `❌ خطأ! الإجابة الصحيحة: <strong>${word.en}</strong>`;
            feedback.style.color = 'var(--danger)';
        }

        state.totalQuestions += 1;
        saveState();
        updateUI();

        // صح: 1.5 ثانية | خطأ: 2.5 ثانية عشان يشوف الإجابة
        const delay = isCorrect ? 1500 : 2500;
        setTimeout(() => {
            currentQuiz.currentIndex += 1;
            currentQuiz.answered = false;
            if (currentQuiz.currentIndex >= currentQuiz.total) {
                finishQuiz();
            } else {
                const types = ['write', 'choice', 'order'];
                currentQuiz.type = types[Math.floor(Math.random() * types.length)];
                renderQuizQuestion();
            }
        }, 1500);
    }

    function finishQuiz() {
        const total = currentQuiz.total;
        const correct = currentQuiz.correctCount || 0;
        const wrong = currentQuiz.wrongCount || 0;
        const html = `
            <div class="card text-center">
                <h2>🎉 انتهى الامتحان!</h2>
                <p style="font-size:1.4rem;">⭐ ${state.score} نقطة</p>
                <div class="flex gap-12" style="justify-content:center;margin:12px 0;">
                    <span class="badge badge-success">✅ ${correct}</span>
                    <span class="badge badge-danger">❌ ${wrong}</span>
                </div>
                <div class="progress-bar"><div class="progress-fill" style="width:${(correct/total*100)||0}%;"></div></div>
                <button class="btn btn-block mt-12" data-action="home">🏠 الرئيسية</button>
                <button class="btn btn-outline btn-block mt-8" data-action="retryQuiz">🔄 إعادة الامتحان</button>
            </div>
        `;
        container.innerHTML = html;
        menuSection.style.display = 'none';
        saveState();
        checkAchievements();
        bindEvents();
    }

    // ============================================================
    //  9. ACHIEVEMENTS
    // ============================================================
    const achievementList = [
        { id: 'first_quiz', label: 'أول امتحان', emoji: '🎯', condition: () => state.totalQuestions >= 1 },
        { id: '100_words', label: '100 كلمة', emoji: '📚', condition: () => state.totalCorrect >= 100 },
        { id: '500_words', label: '500 كلمة', emoji: '🏅', condition: () => state.totalCorrect >= 500 },
        { id: '1000_words', label: '1000 كلمة', emoji: '👑', condition: () => state.totalCorrect >= 1000 },
        { id: 'combo_100', label: '100 إجابة متتالية', emoji: '🔥', condition: () => state.maxCombo >= 100 },
    ];

    function checkAchievements() {
        let unlocked = 0;
        for (let ach of achievementList) {
            if (!state.achievements.includes(ach.id) && ach.condition()) {
                state.achievements.push(ach.id);
                unlocked++;
                setTimeout(() => {
                    alert(`🏆 إنجاز جديد: ${ach.emoji} ${ach.label}`);
                }, 500);
            }
        }
        if (unlocked > 0) saveState();
    }

    // ============================================================
    //  10. STATS
    // ============================================================
    function renderStats() {
        let html = `<div class="card"><h2>📊 الإحصائيات</h2>`;
        const total = countAllWords();
        const correct = state.totalCorrect;
        const wrong = state.totalWrong;
        const ratio = total > 0 ? Math.round((correct / (correct + wrong || 1)) * 100) : 0;
        html += `<div class="stat-row"><span>إجمالي الكلمات</span><span>${total}</span></div>
            <div class="stat-row"><span>إجابات صحيحة</span><span>${correct}</span></div>
            <div class="stat-row"><span>إجابات خاطئة</span><span>${wrong}</span></div>
            <div class="stat-row"><span>نسبة النجاح</span><span>${ratio}%</span></div>
            <div class="stat-row"><span>أعلى كومبو</span><span>${state.maxCombo}</span></div>
            <div class="stat-row"><span>النقاط</span><span>${state.score}</span></div>
            <div class="stat-row"><span>المستوى</span><span>${state.level}</span></div>
        `;
        const wrongEntries = Object.entries(state.wrongWords).filter(([_, count]) => count > 0);
        if (wrongEntries.length > 0) {
            html += `<h3>❌ كلمات خاطئة</h3><div class="flex gap-8 flex-wrap">`;
            wrongEntries.forEach(([word, count]) => {
                html += `<span class="tag">${word} (${count})</span>`;
            });
            html += `</div>`;
        }
        const hardEntries = Object.entries(state.hardWords).filter(([_, count]) => count >= 3);
        if (hardEntries.length > 0) {
            html += `<h3>💪 كلمات صعبة</h3><div class="flex gap-8 flex-wrap">`;
            hardEntries.forEach(([word, _]) => {
                html += `<span class="tag" style="background:var(--danger);color:#fff;">${word}</span>`;
            });
            html += `</div>`;
        }
        html += `<h3>🏅 الإنجازات</h3><div class="achievement-grid">`;
        for (let ach of achievementList) {
            const unlocked = state.achievements.includes(ach.id);
            html += `<div class="achievement-item ${unlocked?'unlocked':''}">
                <span class="emoji">${ach.emoji}</span>
                ${ach.label}
            </div>`;
        }
        html += `</div>`;
        html += `<button class="btn btn-outline btn-block mt-12" data-action="home">🔙 رجوع</button></div>`;
        showScreen(html);
        menuSection.style.display = 'none';
    }

    // ============================================================
    //  11. WRONG & HARD WORDS
    // ============================================================
    function renderWrongWords() {
        let words = [];
        for (let w in state.wrongWords) {
            if (state.wrongWords[w] > 0) {
                const found = findWordByEn(w);
                if (found) words.push(found);
            }
        }
        if (words.length === 0) {
            showScreen(`<div class="card text-center"><h2>❌ لا توجد كلمات خاطئة</h2><button class="btn btn-block mt-12" data-action="home">🏠 الرئيسية</button></div>`);
            menuSection.style.display = 'none';
            return;
        }
        showExamPrep(words, 'كلمات خاطئة');
    }

    function renderHardWords() {
        let words = [];
        for (let w in state.hardWords) {
            if (state.hardWords[w] >= 3) {
                const found = findWordByEn(w);
                if (found) words.push(found);
            }
        }
        if (words.length === 0) {
            showScreen(`<div class="card text-center"><h2>💪 لا توجد كلمات صعبة</h2><button class="btn btn-block mt-12" data-action="home">🏠 الرئيسية</button></div>`);
            menuSection.style.display = 'none';
            return;
        }
        showExamPrep(words, 'كلمات صعبة');
    }

    function findWordByEn(en) {
        for (let unit in data) {
            for (let lesson in data[unit]) {
                for (let w of data[unit][lesson]) {
                    if (w.en.toLowerCase() === en.toLowerCase()) return w;
                }
            }
        }
        return null;
    }

    // ============================================================
    //  12. EXAM PREP
    // ============================================================
    function showExamPrep(words, title) {
        window._prepWords = words;
        const html = `
            <div class="card text-center">
                <h2>📝 ${title}</h2>
                <p>عدد الكلمات: <strong>${words.length}</strong></p>
                <div class="flex gap-8" style="justify-content:center;margin:14px 0;flex-wrap:wrap;">
                    <button class="btn btn-outline" id="showWordsList">👀 عرض الكلمات</button>
                    <button class="btn btn-success" id="startPrepExam">🚀 ابدأ الامتحان مباشرة</button>
                </div>
                <button class="btn btn-outline btn-block mt-8" data-action="home">🔙 رجوع</button>
            </div>
        `;
        showScreen(html);
        menuSection.style.display = 'none';
        document.getElementById('startPrepExam')?.addEventListener('click', function() {
            startQuiz(words, 'random');
        });
        document.getElementById('showWordsList')?.addEventListener('click', function() {
            showWordsPreview(words, title);
        });
    }

    function showWordsPreview(words, title) {
        let listHTML = '';
        words.forEach((w, i) => {
            listHTML += `<div class="stat-row" style="text-align:right;">
                <span style="font-weight:700;direction:ltr;display:inline-block;">${w.en}</span>
                <span class="text-muted">${w.ar}</span>
            </div>`;
        });
        const html = `
            <div class="card">
                <h2 class="text-center">👀 مراجعة الكلمات</h2>
                <p class="text-center text-muted mb-12">${title} — ${words.length} كلمة</p>
                <div style="max-height:55vh;overflow-y:auto;padding:4px 2px;">
                    ${listHTML}
                </div>
                <button class="btn btn-success btn-block mt-12" id="startFromPreview">🚀 ابدأ الامتحان</button>
                <button class="btn btn-outline btn-block mt-8" id="backToPrep">🔙 رجوع</button>
            </div>
        `;
        showScreen(html);
        menuSection.style.display = 'none';
        document.getElementById('startFromPreview')?.addEventListener('click', function() {
            startQuiz(words, 'random');
        });
        document.getElementById('backToPrep')?.addEventListener('click', function() {
            showExamPrep(words, title);
        });
    }

    function renderFullExam() {
        let allWords = [];
        for (let unit in data) {
            for (let lesson in data[unit]) {
                allWords = allWords.concat(data[unit][lesson]);
            }
        }
        if (allWords.length === 0) {
            alert('لا توجد كلمات');
            return;
        }
        showExamPrep(allWords, 'امتحان المنهج كامل');
    }

    // ============================================================
    //  13. SETTINGS
    // ============================================================
    function renderSettings() {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        const html = `
            <div class="card">
                <h2>⚙️ الإعدادات</h2>
                <div class="flex-between">
                    <span>الوضع الليلي</span>
                    <button class="btn btn-sm" id="themeSwitch">${isDark ? '☀️' : '🌙'}</button>
                </div>
                <hr style="margin:12px 0;border-color:var(--border);">
                <button class="btn btn-danger btn-block" id="resetData">🗑️ إعادة ضبط البيانات</button>
                <button class="btn btn-outline btn-block mt-8" data-action="home">🔙 رجوع</button>
            </div>
        `;
        showScreen(html);
        menuSection.style.display = 'none';
        document.getElementById('themeSwitch')?.addEventListener('click', toggleTheme);
        document.getElementById('resetData')?.addEventListener('click', function() {
            if (confirm('هل أنت متأكد؟ سيتم حذف جميع البيانات.')) {
                localStorage.removeItem('wordmaster_state');
                localStorage.removeItem('wordmaster_selected');
                location.reload();
            }
        });
    }

    // ============================================================
    //  14. THEME
    // ============================================================
    function toggleTheme() {
        const root = document.documentElement;
        const current = root.getAttribute('data-theme');
        const next = current === 'dark' ? '' : 'dark';
        root.setAttribute('data-theme', next);
        document.getElementById('themeToggle').textContent = next === 'dark' ? '☀️' : '🌙';
        localStorage.setItem('theme', next);
    }

    // ============================================================
    //  15. BIND EVENTS
    // ============================================================
    function bindEvents() {
        document.querySelectorAll('[data-action]').forEach(el => {
            el.addEventListener('click', function(e) {
                const action = this.dataset.action;
                switch(action) {
                    case 'home': goHome(); break;
                    case 'unitSelect': renderUnitSelect(); break;
                    case 'lessonUnitSelect': renderLessonUnitSelect(); break;
                    case 'lessonSelect': renderLessonUnitSelect(); break;
                    case 'multiSelect': renderMultiSelect(); break;
                    case 'fullExam': renderFullExam(); break;
                    case 'wrongWords': renderWrongWords(); break;
                    case 'hardWords': renderHardWords(); break;
                    case 'stats': renderStats(); break;
                    case 'settings': renderSettings(); break;
                    case 'quitQuiz': if(confirm('إنهاء الامتحان؟')) goHome(); break;
                    case 'retryQuiz': {
                        const words = currentQuiz.words;
                        startQuiz(words, 'random');
                        break;
                    }
                }
            });
        });
        // أزرار اختيار وحدة كاملة (كلمات الوحدة كلها)
        document.querySelectorAll('[data-unit-full]').forEach(el => {
            el.addEventListener('click', function() {
                const unit = this.dataset.unitFull;
                let words = [];
                if (data[unit]) {
                    for (let lesson in data[unit]) {
                        words = words.concat(data[unit][lesson]);
                    }
                }
                if (words.length === 0) { alert('لا توجد كلمات'); return; }
                showExamPrep(words, `${unit} - كل الدروس`);
            });
        });
        // أزرار اختيار درس (أو وحدة ثم درس)
        document.querySelectorAll('button[data-unit]').forEach(el => {
            el.addEventListener('click', function() {
                const unit = this.dataset.unit;
                const lesson = this.dataset.lesson;
                if (lesson) {
                    const words = data[unit][lesson] || [];
                    if (words.length === 0) { alert('لا توجد كلمات'); return; }
                    showExamPrep(words, `${unit} - ${lesson}`);
                } else {
                    renderLessonSelect(unit);
                }
            });
        });
        document.getElementById('startMultiExam')?.addEventListener('click', function() {
            const words = getWordsFromSelection(selectedUnitsLessons);
            if (words.length === 0) { alert('اختر درسًا واحدًا على الأقل'); return; }
            showExamPrep(words, 'امتحان متعدد');
        });
    }

    // ============================================================
    //  16. INIT
    // ============================================================
    loadState();
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.getElementById('themeToggle').textContent = '☀️';
    }
    updateUI();
    document.getElementById('themeToggle').addEventListener('click', toggleTheme);
    document.querySelectorAll('[data-screen]').forEach(el => {
        el.addEventListener('click', function() {
            const screen = this.dataset.screen;
            switch(screen) {
                case 'unitSelect': renderUnitSelect(); break;
                case 'lessonSelect': renderLessonUnitSelect(); break;
                case 'multiSelect': renderMultiSelect(); break;
                case 'fullExam': renderFullExam(); break;
                case 'wrongWords': renderWrongWords(); break;
                case 'hardWords': renderHardWords(); break;
                case 'stats': renderStats(); break;
                case 'settings': renderSettings(); break;
            }
        });
    });

    console.log('✅ WordMaster loaded! Total words:', countAllWords());
    console.log('📊 State:', state);
</script>
</body>
</html>
